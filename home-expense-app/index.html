<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Build Ledger</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#b45309">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#292524;--muted:#78716c;--line:#e7e0d6;--brand:#b45309;--brand2:#fef3c7;--ok:#15803d;--bad:#b91c1c;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292524;--ink:#f5f5f4;--muted:#a8a29e;--line:#44403c;--brand:#f59e0b;--brand2:#44340f;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292524;--ink:#f5f5f4;--muted:#a8a29e;--line:#44403c;--brand:#f59e0b;--brand2:#44340f;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--brand);color:var(--bg);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:1.1rem;margin:0}
header button{background:var(--bg);color:var(--brand)}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:1;min-width:max-content;padding:12px 14px;background:none;border:0;border-radius:0;border-bottom:3px solid transparent;color:var(--muted)}
nav button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px;padding-bottom:88px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.stat small{color:var(--muted);display:block}
.stat b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:var(--muted)}
h2{font-size:1.05rem;margin:18px 0 10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--brand);color:var(--bg)}
button.ghost{background:var(--brand2);color:var(--brand)}
button.link{background:none;color:var(--bad);padding:4px 8px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical}
label input,label select,label textarea{font-size:1rem;margin-top:3px;display:block;color:var(--ink)}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.row>button{flex:0 0 auto}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.over{background:var(--bad)}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item>*{min-width:0}
.item .amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
dialog{border:0;border-radius:var(--r);padding:18px;width:min(460px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:50%;width:56px;height:56px;font-size:28px;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tag{display:inline-block;background:var(--brand2);color:var(--brand);border-radius:8px;padding:1px 8px;font-size:.78rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:6px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header><h1 id="title">🏠 My Home</h1><button data-a="settings">⚙ Settings</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<button class="fab" id="fab" data-a="addExpense" title="Add expense" aria-label="Add expense">+</button>
<dialog id="dlg"></dialog>

<script>
'use strict';
const KEY = 'home-build-ledger-v1';
const DEF_CATS = ['Cement','Steel (TMT bars)','Sand / M-sand / Metal','Bricks / Blocks','Tiles / Flooring','Electrical','Plumbing / Sanitary','Carpentry / Doors & Windows','Painting','Furniture / Interiors','Plan / Licence / Fees','Transport / Loading','Daily wages','Food / Tea','Others'];
const DEF_SLABS = ['Foundation','Basement','Lintel','Roof slab','Plastering','Flooring','Finishing'];
const CON = 'Contractor (slab payments)';
const TABS = [['dash','Dashboard'],['exp','Expenses'],['con','Contractor'],['bud','Budget'],['rep','Reports']];
const MODES = ['Cash','UPI / GPay','Bank transfer','Cheque','Credit / Due'];
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const inr = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

function fresh() {
  return { project: { name: 'My Home', budget: 0 }, cats: DEF_CATS.slice(), budgets: {}, exp: [],
    con: { name: '', phone: '', slabs: DEF_SLABS.map(n => ({ id: uid(), name: n, amount: 0, pay: [] })) } };
}
let S, tab = 'dash', filt = { cat: '', q: '' };
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { S = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

/* ---------- calculations ---------- */
const slabPaid = s => s.pay.reduce((a, p) => a + p.amount, 0);
const conPaid = () => S.con.slabs.reduce((a, s) => a + slabPaid(s), 0);
const conTotal = () => S.con.slabs.reduce((a, s) => a + s.amount, 0);
const ownTotal = () => S.exp.reduce((a, e) => a + e.amount, 0);
const grand = () => ownTotal() + conPaid();
function byCat() {
  const m = {};
  S.exp.forEach(e => m[e.cat] = (m[e.cat] || 0) + e.amount);
  if (conPaid()) m[CON] = conPaid();
  return m;
}
function byMonth() {
  const m = {};
  S.exp.forEach(e => { const k = e.date.slice(0, 7); m[k] = (m[k] || 0) + e.amount; });
  S.con.slabs.forEach(s => s.pay.forEach(p => { const k = p.date.slice(0, 7); m[k] = (m[k] || 0) + p.amount; }));
  return Object.entries(m).sort();
}
const pct = (a, b) => b > 0 ? Math.min(100, a / b * 100) : 0;

/* ---------- views ---------- */
function vDash() {
  const g = grand(), b = S.project.budget, left = b - g, cats = Object.entries(byCat()).sort((a, c) => c[1] - a[1]);
  return `<div class="grid">
    <div class="card stat"><small>Total spent</small><b>${inr(g)}</b></div>
    <div class="card stat"><small>Budget</small><b>${b ? inr(b) : '—'}</b></div>
    <div class="card stat"><small>Budget left</small><b class="${left < 0 ? 'bad' : 'ok'}">${b ? inr(left) : '—'}</b></div>
    <div class="card stat"><small>Paid to contractor</small><b>${inr(conPaid())}</b></div>
    <div class="card stat"><small>Contractor balance</small><b class="bad">${inr(Math.max(0, conTotal() - conPaid()))}</b></div>
    <div class="card stat"><small>Own expenses</small><b>${inr(ownTotal())}</b></div>
  </div>
  ${b ? `<div class="card"><div class="row"><span>Budget used</span><b style="text-align:right">${Math.round(g / b * 100)}%</b></div><div class="bar"><i class="${g > b ? 'over' : ''}" style="width:${pct(g, b)}%"></i></div></div>` : '<div class="card muted">Set your total budget from ⚙ Settings at the top.</div>'}
  <h2>Spending by category</h2>
  <div class="card">${cats.length ? cats.map(([c, v]) => `<div style="margin-bottom:10px"><div class="row"><span>${esc(c)}</span><b style="text-align:right">${inr(v)} <small class="muted">(${Math.round(v / g * 100)}%)</small></b></div><div class="bar"><i style="width:${pct(v, g)}%"></i></div></div>`).join('') : '<span class="muted">No expenses yet. Tap the + button to add the first one.</span>'}</div>
  <h2>By month</h2>
  <div class="card">${byMonth().map(([m, v]) => `<div class="item"><span>${m}</span><span class="amt">${inr(v)}</span></div>`).join('') || '<span class="muted">—</span>'}</div>`;
}

function vExp() {
  const list = S.exp.filter(e => (!filt.cat || e.cat === filt.cat) && (!filt.q || (e.desc + e.payee).toLowerCase().includes(filt.q.toLowerCase()))).sort((a, b) => b.date.localeCompare(a.date));
  const tot = list.reduce((a, e) => a + e.amount, 0);
  return `<div class="row"><select id="fcat" aria-label="Filter by category"><option value="">All categories</option>${S.cats.map(c => `<option ${filt.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select><input id="fq" placeholder="Search…" aria-label="Search" value="${esc(filt.q)}"></div>
  <p class="muted">${list.length} entries · total <b>${inr(tot)}</b></p>
  <div class="card">${list.map(e => `<div class="item"><div><b>${esc(e.desc || e.cat)}</b><br><span class="tag">${esc(e.cat)}</span> <small class="muted">${e.date}${e.payee ? ' · ' + esc(e.payee) : ''}${e.mode ? ' · ' + esc(e.mode) : ''}</small></div><div style="text-align:right"><div class="amt">${inr(e.amount)}</div><button class="ghost" data-a="editExpense" data-id="${e.id}">Edit</button><button class="link" data-a="delExpense" data-id="${e.id}">Delete</button></div></div>`).join('') || '<span class="muted">No entries.</span>'}</div>`;
}

function vCon() {
  const c = S.con;
  return `<div class="card"><div class="row"><div><label for="cname">Contractor name</label><input id="cname" value="${esc(c.name)}"></div><div><label for="cphone">Phone</label><input id="cphone" value="${esc(c.phone)}" inputmode="tel"></div></div></div>
  <div class="grid">
    <div class="card stat"><small>Total contract</small><b>${inr(conTotal())}</b></div>
    <div class="card stat"><small>Paid</small><b class="ok">${inr(conPaid())}</b></div>
    <div class="card stat"><small>Balance</small><b class="bad">${inr(conTotal() - conPaid())}</b></div>
  </div>
  <div class="row" style="margin-bottom:8px"><h2 style="margin:0;flex:1">Slab-wise</h2><button data-a="addSlab">+ Add slab / stage</button></div>
  ${c.slabs.map(s => { const p = slabPaid(s); return `<div class="card">
    <div class="row"><b>${esc(s.name)}</b><span style="text-align:right">Contract: <b>${inr(s.amount)}</b></span></div>
    <div class="bar"><i class="${p > s.amount && s.amount ? 'over' : ''}" style="width:${pct(p, s.amount)}%"></i></div>
    <p class="muted" style="margin:6px 0">Paid <b class="ok">${inr(p)}</b> · Balance <b class="${s.amount - p < 0 ? 'bad' : ''}">${inr(s.amount - p)}</b></p>
    ${s.pay.sort((a, b) => b.date.localeCompare(a.date)).map(x => `<div class="item"><span>${x.date}${x.note ? ' · ' + esc(x.note) : ''}</span><span><b>${inr(x.amount)}</b> <button class="link" data-a="delPay" data-s="${s.id}" data-id="${x.id}" aria-label="Delete payment">✕</button></span></div>`).join('')}
    <div class="row" style="margin-top:8px"><button data-a="addPay" data-s="${s.id}">+ Payment made</button><button class="ghost" data-a="editSlab" data-s="${s.id}">Edit amount / name</button><button class="link" data-a="delSlab" data-s="${s.id}">Remove slab</button></div>
  </div>`; }).join('')}`;
}

function vBud() {
  const cats = byCat(), all = S.cats.concat(cats[CON] !== undefined ? [CON] : []);
  return `<p class="muted">Set a budget for each category to see how much is spent and what is left.</p>
  ${all.map(c => { const b = S.budgets[c] || 0, v = cats[c] || 0; return `<div class="card"><div class="row"><b>${esc(c)}</b><input type="number" inputmode="numeric" min="0" data-bud="${esc(c)}" value="${b || ''}" placeholder="Budget ₹" aria-label="Budget for ${esc(c)}" style="max-width:150px"></div>
  <div class="bar"><i class="${b && v > b ? 'over' : ''}" style="width:${pct(v, b || v)}%"></i></div>
  <small class="muted">Spent ${inr(v)}${b ? ` · Left <span class="${b - v < 0 ? 'bad' : 'ok'}">${inr(b - v)}</span>` : ''}</small></div>`; }).join('')}`;
}

function vRep() {
  return `<div class="card"><h2 style="margin-top:0">Export</h2>
  <div class="row"><button data-a="csv">📄 CSV (opens in Excel)</button></div></div>
  <div class="card"><h2 style="margin-top:0">Backup</h2><p class="muted">Your data is saved only on this device and browser. Take a backup now and then.</p>
  <div class="row"><button data-a="backup">⬇ Take backup</button><button class="ghost" data-a="restore">⬆ Restore</button></div></div>
  <div class="card"><h2 style="margin-top:0">Summary</h2><table class="tbl"><tr><th align="left">Category</th><th align="right">Amount</th></tr>${Object.entries(byCat()).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<tr><td>${esc(c)}</td><td align="right">${inr(v)}</td></tr>`).join('')}<tr><th align="left">Total</th><th align="right">${inr(grand())}</th></tr></table></div>
  <div class="card"><button class="link" data-a="reset">Erase all data</button></div>`;
}

const VIEWS = { dash: vDash, exp: vExp, con: vCon, bud: vBud, rep: vRep };
function render() {
  $('#title').textContent = '🏠 ' + (S.project.name || 'My Home');
  $('#nav').innerHTML = TABS.map(([k, n]) => `<button class="${tab === k ? 'on' : ''}" data-a="tab" data-id="${k}">${n}</button>`).join('');
  $('#main').innerHTML = VIEWS[tab]();
  $('#fab').hidden = tab === 'con' || tab === 'rep';
}

/* ---------- dialogs ---------- */
function ask(title, fields, onOk, extra = '') {
  const d = $('#dlg');
  d.innerHTML = `<form method="dialog"><h2 style="margin-top:0">${title}</h2>${fields}${extra}<div class="row" style="margin-top:16px"><button type="button" class="ghost" id="dno">Cancel</button><button id="dyes">Save</button></div></form>`;
  d.showModal();
  $('#dno').onclick = () => d.close();
  d.querySelector('form').onsubmit = ev => {
    ev.preventDefault();
    const v = {}; d.querySelectorAll('[name]').forEach(i => v[i.name] = i.value.trim());
    if (onOk(v) !== false) { d.close(); save(); render(); }
  };
}
function sure(msg, fn) {
  const d = $('#dlg');
  d.innerHTML = `<h2 style="margin-top:0">${esc(msg)}</h2><div class="row" style="margin-top:16px"><button class="ghost" id="dno">No</button><button id="dyes">Yes</button></div>`;
  d.showModal();
  $('#dno').onclick = () => d.close();
  $('#dyes').onclick = () => { d.close(); fn(); };
}
function exportBox(title, text, file, type) {
  const d = $('#dlg');
  d.innerHTML = `<h2 style="margin-top:0">${esc(title)}</h2><textarea id="dout" rows="8" readonly aria-label="${esc(title)}">${esc(text)}</textarea><div class="row" style="margin-top:12px"><button class="ghost" id="dno">Close</button><button class="ghost" id="dsave">Download</button><button id="dyes">Copy</button></div>`;
  d.showModal();
  const ta = $('#dout');
  $('#dno').onclick = () => d.close();
  $('#dyes').onclick = () => { ta.select(); navigator.clipboard.writeText(text).then(() => { $('#dyes').textContent = 'Copied ✓'; }, () => {}); };
  $('#dsave').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = file; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
}
const num = v => Math.max(0, parseFloat(v) || 0);
const fld = (n, l, val = '', t = 'text', x = '') => `<label>${l}<input name="${n}" type="${t}" value="${esc(val)}" ${x}></label>`;

function expForm(e) {
  e = e || { date: today(), cat: S.cats[0], desc: '', amount: '', payee: '', mode: MODES[0] };
  ask(e.id ? 'Edit expense' : 'New expense',
    fld('date', 'Date', e.date, 'date', 'required') +
    `<label>Category<select name="cat">${S.cats.map(c => `<option ${c === e.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>` +
    fld('desc', 'Description (e.g. 50 bags of cement)', e.desc) +
    fld('amount', 'Amount (₹)', e.amount, 'number', 'required min="1" step="any" inputmode="decimal"') +
    fld('payee', 'Paid to / shop', e.payee) +
    `<label>Payment mode<select name="mode">${MODES.map(m => `<option ${m === e.mode ? 'selected' : ''}>${m}</option>`).join('')}</select></label>`,
    v => {
      const o = { id: e.id || uid(), date: v.date, cat: v.cat, desc: v.desc, amount: num(v.amount), payee: v.payee, mode: v.mode };
      if (!o.amount) return false;
      e.id ? Object.assign(S.exp.find(x => x.id === e.id), o) : S.exp.push(o);
    },
    `<button type="button" class="link" id="addcat">+ New category</button>`);
  $('#addcat').onclick = () => ask('New category', fld('name', 'Category name', '', 'text', 'required'), v => {
    if (!v.name) return false;
    S.cats.push(v.name); setTimeout(() => expForm({ ...e, cat: v.name }), 0);
  });
}

function settings() {
  ask('Settings', fld('name', 'Project name', S.project.name) + fld('budget', 'Total budget (₹)', S.project.budget || '', 'number', 'min="0" inputmode="numeric"'),
    v => { S.project.name = v.name || 'My Home'; S.project.budget = num(v.budget); });
}

/* ---------- actions ---------- */
const slab = id => S.con.slabs.find(s => s.id === id);
const csvCell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
const ACT = {
  tab: t => { tab = t.dataset.id; render(); scrollTo(0, 0); },
  settings, addExpense: () => expForm(),
  editExpense: t => expForm(S.exp.find(e => e.id === t.dataset.id)),
  delExpense: t => sure('Delete this expense?', () => { S.exp = S.exp.filter(e => e.id !== t.dataset.id); save(); render(); }),
  addSlab: () => ask('New slab / stage', fld('name', 'Name', '', 'text', 'required') + fld('amount', 'Contract amount (₹)', '', 'number', 'min="0"'),
    v => { if (!v.name) return false; S.con.slabs.push({ id: uid(), name: v.name, amount: num(v.amount), pay: [] }); }),
  editSlab: t => { const s = slab(t.dataset.s); ask('Edit slab', fld('name', 'Name', s.name, 'text', 'required') + fld('amount', 'Contract amount (₹)', s.amount, 'number', 'min="0"'), v => { s.name = v.name || s.name; s.amount = num(v.amount); }); },
  delSlab: t => { const s = slab(t.dataset.s); sure(`Remove "${s.name}"? Its payments will be deleted too.`, () => { S.con.slabs = S.con.slabs.filter(x => x !== s); save(); render(); }); },
  addPay: t => { const s = slab(t.dataset.s); ask(`${esc(s.name)} - payment made`, fld('date', 'Date', today(), 'date', 'required') + fld('amount', 'Amount (₹)', '', 'number', 'required min="1" step="any" inputmode="decimal"') + fld('note', 'Note (e.g. advance, cheque no.)'), v => { if (!num(v.amount)) return false; s.pay.push({ id: uid(), date: v.date, amount: num(v.amount), note: v.note }); }); },
  delPay: t => { const s = slab(t.dataset.s); sure('Delete this payment?', () => { s.pay = s.pay.filter(p => p.id !== t.dataset.id); save(); render(); }); },
  csv: () => {
    const rows = [['Date', 'Category', 'Description', 'Amount', 'Paid to', 'Mode']];
    S.exp.forEach(e => rows.push([e.date, e.cat, e.desc, e.amount, e.payee, e.mode]));
    S.con.slabs.forEach(s => s.pay.forEach(p => rows.push([p.date, CON, `${s.name} ${p.note}`.trim(), p.amount, S.con.name, ''])));
    rows.sort((a, b) => (a[0] > b[0] ? 1 : -1));
    exportBox('CSV export', rows.map(r => r.map(csvCell).join(',')).join('\n'), 'home-expenses.csv', 'text/csv;charset=utf-8');
  },
  backup: () => exportBox('Backup ' + today(), JSON.stringify(S), `home-ledger-backup-${today()}.json`, 'application/json'),
  restore: () => ask('Restore backup', '<label>Paste your backup text here (this replaces current data)<textarea name="t" rows="7" required></textarea></label><p id="err" class="bad"></p>', v => {
    try {
      const d = JSON.parse(v.t);
      if (!d || !Array.isArray(d.exp) || !d.con || !Array.isArray(d.con.slabs) || !Array.isArray(d.cats)) throw 0;
      S = { ...fresh(), ...d };
    } catch { $('#err').textContent = 'This is not a valid backup.'; return false; }
  }),
  reset: () => sure('Erase all data? This cannot be undone.', () => { S = fresh(); save(); render(); })
};
document.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if (t && ACT[t.dataset.a]) ACT[t.dataset.a](t); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cname') { S.con.name = t.value; save(); }
  else if (t.id === 'cphone') { S.con.phone = t.value; save(); }
  else if (t.dataset.bud) { S.budgets[t.dataset.bud] = num(t.value); save(); }
  else if (t.id === 'fq') { filt.q = t.value; const p = t.selectionStart; render(); const n = $('#fq'); n.focus(); n.setSelectionRange(p, p); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'fcat') { filt.cat = e.target.value; render(); }
  else if (e.target.dataset.bud) render();
});
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
